<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF"/>
      <stop offset="50%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="iconShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5EEAD4"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Icon Background -->
  <rect x="5" y="5" width="70" height="70" rx="14" fill="url(#iconGradient)"/>

  <!-- Vertical highlight bar -->
  <rect x="18" y="12" width="6" height="56" rx="3" fill="#5EEAD4" opacity="0.4"/>

  <!-- Wave 1 (top) -->
  <path d="M12 22 Q25 18, 40 22 Q55 26, 68 22" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Wave 2 (middle) -->
  <path d="M12 40 Q25 36, 40 40 Q55 44, 68 40" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Wave 3 (bottom) -->
  <path d="M12 58 Q25 54, 40 58 Q55 62, 68 58" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Text: "copper" -->
  <text x="95" y="48" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="400" fill="#334155" letter-spacing="-0.5">copper</text>

  <!-- Text: "LEGAL" -->
  <text x="232" y="48" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#14B8A6" letter-spacing="1">LEGAL</text>

  <!-- Tagline -->
  <text x="95" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-style="italic" fill="#94A3B8">AI-native legal practice management</text>
</svg>
