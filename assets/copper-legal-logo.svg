<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5EEAD4"/>
      <stop offset="50%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Icon Background -->
  <rect x="5" y="5" width="70" height="70" rx="14" fill="url(#iconGradient)"/>

  <!-- Shine curve at bottom -->
  <path d="M5 55 Q40 48, 75 55 L75 61 Q75 75, 61 75 L19 75 Q5 75, 5 61 Z" fill="url(#shineGradient)"/>

  <!-- Top horizontal bar -->
  <rect x="14" y="14" width="52" height="8" rx="2" fill="white" opacity="0.95"/>

  <!-- Three vertical pillars -->
  <rect x="17" y="24" width="10" height="38" rx="2" fill="white" opacity="0.85"/>
  <rect x="35" y="24" width="10" height="38" rx="2" fill="white" opacity="0.85"/>
  <rect x="53" y="24" width="10" height="38" rx="2" fill="white" opacity="0.85"/>

  <!-- Bottom horizontal bar -->
  <rect x="14" y="58" width="52" height="8" rx="2" fill="white" opacity="0.95"/>

  <!-- Text: "copperLegal" -->
  <text x="95" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="400" letter-spacing="-0.5"><tspan fill="#374151">copper</tspan><tspan fill="#14B8A6">Legal</tspan></text>

  <!-- Tagline -->
  <text x="95" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-style="italic" fill="#6B7280">AI-native legal practice management</text>
</svg>
